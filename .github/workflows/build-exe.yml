name: Build Windows EXE

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/build-exe.yml"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Reference Authenticator
        working-directory: backend
        shell: bash
        run: |
          pyinstaller --onedir --console --name ReferenceAuthenticator \
            --add-data "../frontend;frontend" \
            --collect-all crewai \
            --collect-all litellm \
            --collect-all tiktoken \
            --collect-all tokenizers \
            --collect-all pymupdf \
            --collect-all fitz \
            --collect-all rapidfuzz \
            --collect-all google.genai \
            --collect-all groq \
            --collect-all openpyxl \
            --collect-all openai \
            --hidden-import=tiktoken_ext \
            --hidden-import=tiktoken_ext.openai_public \
            server.py

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: ReferenceAuthenticator-windows
          path: backend/dist/ReferenceAuthenticator
